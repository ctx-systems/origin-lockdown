name: Update IP lists

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch lists
        run: python3 scripts/update_ips.py
      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-ips
          commit-message: "Update IP lists"
          title: "Update IP lists"
          body: |
            Automated refresh by `scripts/update_ips.py`. Review the diff before merging.
            Manual providers aren't covered. See UPDATE_PROMPT.md.
          add-paths: ips/
          delete-branch: true
      - name: Check manual providers against their doc pages
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 scripts/check_manual.py > report.md; then
            cat report.md
            exit 0
          fi
          cat report.md
          title="Manual IP lists differ from provider docs"
          body="$(printf '%s\n\n%s\n\nUpdate the lists by hand (see UPDATE_PROMPT.md). Scraped from HTML, so double-check against the page.' \
            "\`scripts/check_manual.py\` found differences:" "$(sed -n '/^###/,$p' report.md)")"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
